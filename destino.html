<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inicio de Sesión / Registro</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body class="pagina2">

    <a href="index.html">
        <img src="img/logo3.png" alt="Logo CH Store" class="logo-principal">
    </a>

    <div class="formulario">
        <h1>Inicio de Sesión</h1>
        
        <form id="formLogin" method="post" novalidate>
            
            <div class="username">
                <input type="text" id="usuario" required>
                <label for="usuario">Nombre de usuario o correo</label>
            </div>

            <small id="errorUsuario" class="mensaje-error"></small>

            <div class="username">
                <input type="password" id="password" required>
                <label for="password">Contraseña</label>
            </div>
            <small id="errorPassword" class="mensaje-error"></small>

            <div class="recordar">¿Olvidaste tu contraseña?</div>
            
            <input type="submit" value="Iniciar Sesión">
            
            <div class="registro">
                ¿No tienes una cuenta? <a href="#">Regístrate</a>
            </div>
        </form>
    </div>

    <script src="scripyt.js"></script>
</body>
</html>
